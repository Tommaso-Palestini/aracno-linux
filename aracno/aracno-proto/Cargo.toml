[package]
name = "aracno-proto"
description = "Interfaccia D-Bus condivisa tra aracnod e i suoi client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# solo per i client (aracno, aracno-menu): aracnod non le usa
zbus = { workspace = true, optional = true }
# traduzioni: gettext di sistema (glibc), nessuna libreria C da compilare
gettext-rs = { version = "0.8", features = ["gettext-system"], optional = true }

[features]
client = ["dep:zbus", "dep:gettext-rs"]
