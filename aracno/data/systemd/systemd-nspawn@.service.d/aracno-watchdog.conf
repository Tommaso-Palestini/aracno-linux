# Aracno: niente watchdog per i fili.
# systemd-nspawn@.service ha WatchdogSec=3min: il processo systemd-nspawn deve
# farsi sentire ogni 3 minuti. Quando un filo è congelato (ADR-0002) quel processo
# è congelato con lui, quindi dopo 3 minuti systemd lo considera bloccato e allo
# scongelamento lo uccide con SIGABRT: il filo muore. Visto il 2026-11-02 sul PC
# (systemd 255), verificato da prototype/15-watchdog-freeze.sh.
# Costo: se systemd-nspawn si blocca davvero, systemd non lo riavvia da solo.
[Service]
WatchdogSec=0
