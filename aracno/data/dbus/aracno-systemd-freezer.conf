<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Aracno: su systemd < 256 circa la policy D-Bus di systemd non permette
  FreezeUnit/ThawUnit agli utenti diversi da root (nelle versioni recenti sì:
  vedi src/core/org.freedesktop.systemd1.conf upstream). Qui li si permette
  SOLO all'utente di sistema "aracno" (servizio aracnod).
  Questo file apre solo il canale: la decisione resta a polkit, che con
  50-aracno.rules concede solo i tentacoli systemd-nspawn@NOME.service.
-->
<busconfig>
  <policy user="aracno">
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="FreezeUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ThawUnit"/>
  </policy>
</busconfig>
