<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Aracno: policy del nome di aracnod sul bus di sistema.
  Solo l'utente "aracno" può possedere il nome. Chiunque può chiamare
  l'interfaccia Manager: il controllo vero lo fa aracnod con polkit
  (switch: sessione attiva; stop: amministratore). Le letture sono libere.
-->
<busconfig>
  <policy user="aracno">
    <allow own="io.github.tommaso_palestini.Aracno1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.tommaso_palestini.Aracno1"
           send_interface="io.github.tommaso_palestini.Aracno1.Manager"/>
    <allow send_destination="io.github.tommaso_palestini.Aracno1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.tommaso_palestini.Aracno1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
