<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Octopus: policy del nome di octod sul bus di sistema.
  Solo l'utente "octopus" può possedere il nome. Chiunque può chiamare
  l'interfaccia Manager: il controllo vero lo fa octod con polkit
  (switch: sessione attiva; stop: amministratore). Le letture sono libere.
-->
<busconfig>
  <policy user="octopus">
    <allow own="io.github.tommaso_palestini.Octopus1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.tommaso_palestini.Octopus1"
           send_interface="io.github.tommaso_palestini.Octopus1.Manager"/>
    <allow send_destination="io.github.tommaso_palestini.Octopus1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.tommaso_palestini.Octopus1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
